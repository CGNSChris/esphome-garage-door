# ============================================================================
# Garage Door Controller — ESP32-C6 variant  (adoptable entry point)
#
# There are two entry points. Pick the one matching the board you bought:
#   garage-door.yaml      ESP32-S3-DevKitC-1-N16R8
#   garage-door-c6.yaml   ESP32-C6-DevKitC-1-N8        <- this file
#
# The pin map is IDENTICAL between them by design, so one wiring harness works
# with either board and you can swap chips without rewiring. Everything below
# the BOARD block must stay in sync across both files —
# scripts/check_variant_parity.py enforces that in CI.
#
# Never edit files under packages/ — they are the firmware; this is the config.
# Docs: docs/wiring.md, docs/calibration.md, docs/bom.md
# ============================================================================
substitutions:
  name: garage-door
  friendly_name: Garage Door

  # ======================= BOARD (differs per variant) ======================
  board: esp32-c6-devkitc-1
  chip_variant: esp32c6
  flash_size: 8MB    # N8. The C6 has no PSRAM variant.
  variant_yaml: garage-door-c6.yaml
  # ==========================================================================

  # --- Pins (safe on BOTH the S3 and the C6) --------------------------------
  # Chosen from the intersection of both chips' usable GPIOs, so the wiring is
  # identical either way. Avoided on S3: 19/20 USB, 0/3/45/46 strapping,
  # 43/44 UART0, 26-32 flash, 33-37 octal PSRAM. Avoided on C6: 12/13 USB,
  # 4/5/8/9/15 strapping, 16/17 UART0, 24-30 flash.
  # Free on both: 1, 2, 6, 7, 10, 11, 14, 18, 21.
  pin_endstop_closed: GPIO18
  pin_endstop_open: GPIO10
  pin_relay: GPIO7
  pin_button: GPIO11
  pin_status_led: GPIO2

  # --- Endstop polarity ---------------------------------------------------
  # Set independently: the two reeds may be different parts, and MC-38-class
  # sellers label N/O and N/C inconsistently. "false" = switch closes to GND
  # when the magnet is present (typical N/O reed wired to GND).
  endstop_closed_inverted: "false"
  endstop_open_inverted: "false"

  # --- Opener behaviour (see docs/calibration.md) ---------------------------
  #   reverse            a press while moving reverses (Type A)
  #   stop_then_reverse  a press while moving stops; the NEXT press reverses (Type B)
  # stop_then_reverse is the safe default: an extra pulse on a Type A opener
  # merely stops the door, whereas a missing pulse on a Type B opener leaves
  # it moving the wrong way.
  opener_cycle_mode: stop_then_reverse
  relay_pulse_width: 500ms
  inter_pulse_gap: 600ms

  # --- Travel calibration (seconds, measured with a stopwatch) --------------
  open_duration: "18.0"
  close_duration: "18.0"
  travel_timeout_factor: "1.5"

  # --- Optional BLE proxy ----------------------------------------------------
  ble_proxy_enabled: "true"

  # --- OTA TLS ---------------------------------------------------------------
  # See the comment in packages/core.yaml before changing this.
  ota_verify_ssl: "false"

  # --- Network ---------------------------------------------------------------
  # Remote packages cannot use !secret, so these are substitutions.
  wifi_ssid: "REPLACE_ME"
  wifi_password: "REPLACE_ME"

  # --- Build / OTA -------------------------------------------------------------
  project_version: "2026.8.1"
  ota_update_url: "https://cgnschris.github.io/esphome-garage-door/manifest.json"

# Adoption pulls from THIS fork — never Athom's manifest (their W3 trap:
# installing from an upstream manifest silently reverts pins and logic).
dashboard_import:
  package_import_url: github://CGNSChris/esphome-garage-door/garage-door-c6.yaml@main
  import_full_config: false

packages:
  core: !include packages/core.yaml
  io: !include packages/io.yaml
  state_machine: !include packages/state-machine.yaml
  # OPTIONAL: an extra button on the controller enclosure. Delete this line
  # if you are relying on the opener's existing wall switch for local control,
  # which is the usual case. It is unrelated to that switch.
  local_button: !include packages/local-button.yaml
  diagnostics: !include packages/diagnostics.yaml
  # No psram: here — the ESP32-C6 has no PSRAM support at all. This is the
  # main functional difference between the two variants, and the reason the
  # S3 is the better host for the BLE proxy.
  # Tier 3 — disposable. Delete or comment this single line to drop the BLE
  # proxy entirely, or set ble_proxy_enabled: "false" to keep it flashed but idle.
  ble_proxy: !include packages/ble-proxy.yaml
