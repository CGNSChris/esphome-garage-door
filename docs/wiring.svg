<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 925" width="980" height="925" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">Garage door controller wiring (ESP32-S3 or ESP32-C6)</title>
  <desc id="svgdesc">Two reed endstops switch to ground on GPIO18 and GPIO10 with internal pull-ups. The controller has no button of its own. GPIO7 drives an opto-isolated relay module, whose opto input runs from 3.3 V while its coil takes 5 V through the JD-VCC pin, and carries a mandatory 10 kilohm resistor to ground. The relay's dry contact and the opener's existing wall switch both bridge the same two wall-button terminals, in parallel, so either can operate the door; the existing wall switch is never connected to the ESP32. GPIO2 drives a status LED through a 1 kilohm resistor.</desc>

  <rect x="0" y="0" width="980" height="925" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="979" height="924" fill="none" stroke="#dddddd"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1a1a1a">

    <text x="40" y="44" font-size="20" font-weight="700">Garage Door Controller &#8212; Wiring</text>
    <text x="40" y="66" font-size="12" fill="#555555">Pins chosen to be valid on BOTH the ESP32-S3 and ESP32-C6, so one harness fits either board. GPIO numbers, not header positions.</text>

    <!-- ============ MCU ============ -->
    <rect x="380" y="130" width="180" height="370" rx="6" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="2"/>
    <text x="470" y="296" font-size="17" font-weight="700" text-anchor="middle">ESP32-S3</text>
    <text x="470" y="316" font-size="12" fill="#555555" text-anchor="middle">or ESP32-C6</text>
    <text x="470" y="336" font-size="11" fill="#555555" text-anchor="middle">DevKitC-1 &#183; same wiring</text>

    <line x1="470" y1="92" x2="470" y2="126" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="484" y="110" font-size="11" fill="#555555">USB-C 5 V</text>

    <!-- ============ LEFT: inputs ============ -->
    <line x1="45" y1="170" x2="45" y2="700" stroke="#1a1a1a" stroke-width="2"/>

    <!-- reed: closed endstop -->
    <rect x="80" y="145" width="160" height="50" rx="4" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="2"/>
    <text x="160" y="166" font-size="12" font-weight="700" text-anchor="middle">Reed &#8212; CLOSED</text>
    <text x="160" y="183" font-size="10" fill="#555555" text-anchor="middle">magnet on door</text>
    <line x1="240" y1="170" x2="380" y2="170" stroke="#1a1a1a" stroke-width="2"/>
    <text x="310" y="162" font-size="11" font-weight="700" text-anchor="middle">GPIO18</text>
    <line x1="80" y1="170" x2="45" y2="170" stroke="#1a1a1a" stroke-width="2"/>

    <!-- reed: open endstop -->
    <rect x="80" y="225" width="160" height="50" rx="4" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="2"/>
    <text x="160" y="246" font-size="12" font-weight="700" text-anchor="middle">Reed &#8212; OPEN</text>
    <text x="160" y="263" font-size="10" fill="#555555" text-anchor="middle">magnet on track</text>
    <line x1="240" y1="250" x2="380" y2="250" stroke="#1a1a1a" stroke-width="2"/>
    <text x="310" y="242" font-size="11" font-weight="700" text-anchor="middle">GPIO10</text>
    <line x1="80" y1="250" x2="45" y2="250" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="45" cy="250" r="4" fill="#1a1a1a"/>

    <text x="240" y="320" font-size="10" font-style="italic" fill="#555555" text-anchor="middle">both reeds: internal pull-up, switch closes to GND</text>

    <!-- status LED -->
    <line x1="380" y1="430" x2="320" y2="430" stroke="#1a1a1a" stroke-width="2"/>
    <text x="350" y="422" font-size="11" font-weight="700" text-anchor="middle">GPIO2</text>
    <rect x="270" y="420" width="50" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="295" y="457" font-size="10" fill="#555555" text-anchor="middle">1 k&#8486;</text>
    <line x1="270" y1="430" x2="240" y2="430" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="240,418 240,442 216,430" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="216" y1="417" x2="216" y2="443" stroke="#1a1a1a" stroke-width="2"/>
    <text x="200" y="457" font-size="10" fill="#555555" text-anchor="middle">status LED</text>
    <line x1="216" y1="430" x2="45" y2="430" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="45" cy="430" r="4" fill="#1a1a1a"/>

    <!-- ============ RIGHT: relay module ============ -->
    <rect x="660" y="150" width="210" height="240" rx="6" fill="#f2f2f0" stroke="#1a1a1a" stroke-width="2"/>
    <text x="765" y="180" font-size="13" font-weight="700" text-anchor="middle">Relay module</text>
    <text x="765" y="198" font-size="10" fill="#555555" text-anchor="middle">opto-isolated &#183; H/L jumper set to H</text>

    <line x1="560" y1="205" x2="660" y2="205" stroke="#1a1a1a" stroke-width="2"/>
    <text x="608" y="197" font-size="11" font-weight="700" text-anchor="middle">5V</text>
    <text x="670" y="209" font-size="10" font-weight="700">JD-VCC</text>

    <line x1="560" y1="250" x2="660" y2="250" stroke="#1a1a1a" stroke-width="2"/>
    <text x="608" y="242" font-size="11" font-weight="700" text-anchor="middle">3V3</text>
    <text x="670" y="254" font-size="10" font-weight="700">VCC</text>

    <line x1="560" y1="295" x2="660" y2="295" stroke="#1a1a1a" stroke-width="2"/>
    <text x="630" y="287" font-size="11" font-weight="700" text-anchor="middle">GPIO7</text>
    <text x="670" y="299" font-size="10" font-weight="700">IN</text>

    <line x1="660" y1="340" x2="640" y2="340" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="640" y1="340" x2="640" y2="700" stroke="#1a1a1a" stroke-width="2"/>
    <text x="670" y="344" font-size="10" font-weight="700">GND</text>

    <text x="765" y="372" font-size="9" font-style="italic" fill="#555555" text-anchor="middle">remove the VCC&#8211;JD-VCC jumper</text>

    <!-- the relay's dry contact, bridging the two opener terminals -->
    <circle cx="720" cy="410" r="3.5" fill="#1f6feb"/>
    <circle cx="810" cy="410" r="3.5" fill="#1f6feb"/>
    <line x1="720" y1="410" x2="806" y2="395" stroke="#1f6feb" stroke-width="2"/>
    <text x="700" y="404" font-size="10" font-weight="700" fill="#1f6feb" text-anchor="middle">COM</text>
    <text x="832" y="404" font-size="10" font-weight="700" fill="#1f6feb" text-anchor="middle">NO</text>

    <!-- 10k pull-down: the one element the safety argument hinges on -->
    <circle cx="600" cy="295" r="4" fill="#1a1a1a"/>
    <line x1="600" y1="295" x2="600" y2="540" stroke="#c0392b" stroke-width="2.5"/>
    <rect x="585" y="540" width="30" height="60" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
    <line x1="600" y1="600" x2="600" y2="700" stroke="#c0392b" stroke-width="2.5"/>
    <text x="575" y="566" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">10 k&#8486; pull-down</text>
    <text x="575" y="583" font-size="10" fill="#c0392b" text-anchor="end">mandatory &#8212; see note</text>

    <!-- ==== OPENER SIDE: two terminals, two switches across them ==== -->
    <line x1="720" y1="410" x2="720" y2="620" stroke="#1f6feb" stroke-width="2"/>
    <line x1="810" y1="410" x2="810" y2="620" stroke="#1f6feb" stroke-width="2"/>

    <circle cx="720" cy="455" r="4.5" fill="#1f6feb"/>
    <circle cx="810" cy="455" r="4.5" fill="#1f6feb"/>
    <text x="840" y="451" font-size="10" font-weight="700" fill="#1f6feb">opener wall-button</text>
    <text x="840" y="464" font-size="10" font-weight="700" fill="#1f6feb">terminals</text>

    <!-- YOUR existing wall switch, across the SAME two terminals -->
    <line x1="720" y1="505" x2="752" y2="505" stroke="#1f6feb" stroke-width="2"/>
    <circle cx="720" cy="505" r="4" fill="#1f6feb"/>
    <circle cx="756" cy="505" r="3.5" fill="#1f6feb"/>
    <circle cx="784" cy="505" r="3.5" fill="#1f6feb"/>
    <line x1="756" y1="505" x2="786" y2="489" stroke="#1f6feb" stroke-width="2"/>
    <line x1="788" y1="505" x2="810" y2="505" stroke="#1f6feb" stroke-width="2"/>
    <circle cx="810" cy="505" r="4" fill="#1f6feb"/>
    <text x="765" y="547" font-size="11" font-weight="700" fill="#1f6feb" text-anchor="middle">YOUR existing wall switch</text>
    <text x="765" y="562" font-size="9" fill="#555555" text-anchor="middle">do not rewire &#8212; never touches the ESP32</text>
    <text x="765" y="575" font-size="9" fill="#555555" text-anchor="middle">keeps working exactly as it does now</text>

    <text x="905" y="470" font-size="10" font-weight="700" fill="#1f6feb" text-anchor="middle">IN</text>
    <text x="905" y="483" font-size="10" font-weight="700" fill="#1f6feb" text-anchor="middle">PARALLEL</text>

    <rect x="680" y="620" width="180" height="62" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
    <text x="770" y="646" font-size="12" font-weight="700" fill="#1f6feb" text-anchor="middle">Garage opener</text>
    <text x="770" y="664" font-size="10" fill="#555555" text-anchor="middle">one momentary input</text>

    <!-- ============ ground ============ -->
    <line x1="470" y1="500" x2="470" y2="700" stroke="#1a1a1a" stroke-width="2"/>
    <text x="482" y="527" font-size="11" font-weight="700">GND</text>
    <line x1="45" y1="700" x2="640" y2="700" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="470" cy="700" r="4" fill="#1a1a1a"/>
    <circle cx="600" cy="700" r="4" fill="#c0392b"/>
    <line x1="640" y1="700" x2="640" y2="714" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="622" y1="714" x2="658" y2="714" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="629" y1="722" x2="651" y2="722" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="636" y1="730" x2="644" y2="730" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="640" y="750" font-size="11" font-weight="700" text-anchor="middle">GND</text>

    <!-- ============ notes ============ -->
    <line x1="40" y1="790" x2="940" y2="790" stroke="#dddddd" stroke-width="1"/>
    <text x="40" y="812" font-size="10" fill="#1f6feb" font-weight="700">Two switches bridge the same two terminals:</text>
    <text x="253" y="812" font-size="10" fill="#555555">our relay contact and your existing wall switch. Either operates the door; neither can see the other. The controller has no button of its own.</text>
    <text x="40" y="830" font-size="10" fill="#555555">Door position never comes from the control path &#8212; it comes from the two reeds, so the door is tracked however it was moved (wall switch, handset, or us).</text>
    <text x="40" y="848" font-size="10" fill="#c0392b" font-weight="700">The 10 k&#8486; pull-down is not optional &#8212; the relay GPIO floats between power-on and firmware boot, and a floating relay input can latch on.</text>
    <text x="40" y="866" font-size="10" fill="#555555">Reserved &#8212; S3: 19/20 USB, 0/3/45/46 strapping, 43/44 UART0, 26&#8211;32 flash, 33&#8211;37 octal PSRAM. C6: 12/13 USB, 4/5/8/9/15 strapping, 16/17 UART0, 24&#8211;30 flash.</text>
    <text x="40" y="884" font-size="10" fill="#555555">Relay module: set the H/L trigger jumper to H, and remove the VCC&#8211;JD-VCC jumper so the opto input runs at 3.3 V while the coil takes 5 V.</text>
    <text x="40" y="902" font-size="10" fill="#555555">Blue = opener-side circuit, galvanically isolated from the ESP32 by the relay's optocoupler. It shares no ground with the controller.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
</svg>
