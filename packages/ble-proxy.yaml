# ble-proxy.yaml — OPTIONAL. Tier 3: the first thing to degrade, the last
# thing to be given resources. Nothing in the door logic depends on this file;
# delete its line from garage-door.yaml to drop it entirely.

esp32_ble_tracker:
  scan_parameters:
    # window 30ms in interval 320ms ≈ 9% receive duty cycle.
    # Athom shipped window 300ms ≈ 94% (upstream W8), which starves WiFi.
    # This stays tuned down even on the dual-core S3: the S3 buys CPU headroom
    # but NOT airtime — it still has a single 2.4 GHz RF chain with
    # time-division WiFi/BLE coexistence, exactly like the C3 and C6. The duty
    # cycle is the radio problem; the second core only relieves the smaller,
    # CPU-side half of it. Cost of 30ms is slightly slower device discovery.
    interval: 320ms
    window: 30ms
    active: true
    continuous: false   # scanning is gated on an actual API connection below

bluetooth_proxy:
  active: true

api:
  # Athom's genuinely good idea, kept: only scan while Home Assistant is
  # actually connected to consume the results.
  on_client_connected:
    - if:
        condition:
          lambda: 'return std::string("${ble_proxy_enabled}") == std::string("true");'
        then:
          - esp32_ble_tracker.start_scan:
              continuous: true
  on_client_disconnected:
    - esp32_ble_tracker.stop_scan:
