# core.yaml — esphome:, esp32:, network, OTA.
# Tier 2 lives here. Nothing in this file may be a dependency of the state
# machine or the relay path (Tier 1).

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  project:
    name: cgnschris.esphome-garage-door
    version: ${project_version}

esp32:
  # Set by the entry point: garage-door.yaml (S3) or garage-door-c6.yaml (C6).
  board: ${board}
  variant: ${chip_variant}
  flash_size: ${flash_size}
  framework:
    type: esp-idf   # required on the C6; the better base on the S3 too

logger:

api:
  # Tier 1 rule: the door must work with the network down. Never reboot just
  # because Home Assistant is unreachable — a reboot mid-travel loses state.
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: http_request   # consumed by the update: component below

safe_mode:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # Tier 1: never reboot on WiFi loss. Endstop sensing and the state machine
  # keep working regardless of network state.
  reboot_timeout: 0s
  ap:
    ssid: "${name} setup"
    # The fallback AP is the only time an HTTP server runs on this device
    # (captive_portal starts one on port 80 for WiFi provisioning, and that
    # server also carries an /update firmware endpoint). Password it.
    password: ${ap_password}

captive_portal:

# Improv over the USB serial port. esp-web-tools offers a "connect to WiFi"
# step in the browser immediately after flashing, so credentials never need
# hard-coding and the fallback-AP route above becomes the backup rather than
# the only path. Rides on the logger's UART; no extra hardware.
improv_serial:

# There is deliberately NO web_server: component. Home Assistant talks to
# ESPHome over the native API (port 6053) and gets every entity that way; the
# web UI would only add an unauthenticated control surface on port 80 (cover,
# Restart, Factory Reset) plus ~6-10 KB of heap on the PSRAM-less C6.

http_request:
  # Upstream ran with verify_ssl off (their W9) because TLS certificate
  # validation costs heap the C6 needed during the OTA download. Firmware
  # integrity is gated by the manifest MD5 rather than by transport security,
  # which is acceptable ONLY because we control the manifest source (this
  # repo's GitHub Pages). Never point ota_update_url at anything you do not
  # control.
  #
  # On the S3 with PSRAM that heap argument is much weaker, so this is now a
  # substitution rather than a hard-coded false: set ota_verify_ssl: "true"
  # in garage-door.yaml once you can watch a real OTA complete on the bench.
  # Untested here — a failed TLS handshake breaks OTA silently, and the MD5
  # gate already covers integrity, so it ships off until proven on hardware.
  verify_ssl: ${ota_verify_ssl}

update:
  - platform: http_request
    name: Firmware
    source: ${ota_update_url}
    update_interval: 6h
