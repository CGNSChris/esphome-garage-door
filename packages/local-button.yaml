# local-button.yaml — OPTIONAL. A physical button on the CONTROLLER, wired to
# the ESP32. This is a NEW part you would mount on the enclosure.
#
# It is NOT your opener's existing wall switch. That switch stays wired to the
# opener's own terminals and is never connected to the ESP32 — the relay simply
# sits in parallel with it (see docs/wiring.md). Nothing here touches it.
#
# You probably do not need this. Its only job is local control when the network
# is down, and an existing hardwired wall switch already does that job better:
# it works even if this controller is unplugged. Delete the local_button line
# from your entry point to drop it, and leave ${pin_button} unwired.
#
# Wiring if you do want it: one leg to ${pin_button}, the other to GND. The
# internal pull-up is enabled, so no external resistor is needed.

binary_sensor:
  - platform: gpio
    id: local_button
    # Deliberately NOT called "Wall Button" — that name invites confusion with
    # the opener's own wall switch, which this is not.
    name: Local Button
    entity_category: diagnostic
    pin:
      number: ${pin_button}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: on_local_button
