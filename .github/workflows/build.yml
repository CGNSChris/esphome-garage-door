name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ESPHome firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fast gate: the two variants describe the same door on the same wiring,
      # so everything except the board block must match. Fail here rather than
      # after two full firmware builds.
      - name: Check variant parity
        run: python3 scripts/check_variant_parity.py

      # Pinned to a full immutable tag on purpose: build-action releases are
      # immutable and there are no floating major tags (@v8 will not resolve).
      # v8.0.0 requires ESPHome >= 2026.7.0.
      - name: Build ESP32-S3 variant
        uses: esphome/build-action@v8.0.0
        id: build-s3
        with:
          yaml-file: garage-door.yaml
          version: latest
          complete-manifest: true

      # Copy immediately: both variants use `name: garage-door`, so the second
      # build writes to the same output directory as the first.
      - name: Stage S3 output
        run: |
          mkdir -p site/firmware/s3
          cp -r "${{ steps.build-s3.outputs.name }}"/. site/firmware/s3/

      - name: Build ESP32-C6 variant
        uses: esphome/build-action@v8.0.0
        id: build-c6
        with:
          yaml-file: garage-door-c6.yaml
          version: latest
          complete-manifest: true

      - name: Stage C6 output
        run: |
          mkdir -p site/firmware/c6
          cp -r "${{ steps.build-c6.outputs.name }}"/. site/firmware/c6/

      - name: Assemble Pages site
        env:
          FW_VERSION: ${{ steps.build-s3.outputs.project-version }}
        run: |
          # One builds array per manifest, covering both chips:
          #  - firmware/manifest.json lets esp-web-tools detect the connected
          #    board over serial and flash the matching image
          #  - manifest.json lets each device's `update:` component match its
          #    own chipFamily, so one OTA URL serves both variants
          # Served from Pages, NOT a Releases URL: Releases redirect to long
          # signed URLs that overflow http_request's 512-byte buffer.
          python3 scripts/make_manifests.py site "$FW_VERSION" s3:ESP32-S3 c6:ESP32-C6
          cp static/index.html site/index.html

      - name: Show what will be published
        run: find site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
